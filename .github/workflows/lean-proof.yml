name: Lean proof verification

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Lean proof
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lean and Lake cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: true

      - name: Check build targets and documentation references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import tomllib

          sources = {path.stem for path in Path(".").glob("*.lean")}
          config = tomllib.loads(Path("lakefile.toml").read_text())
          targets = {entry["name"] for entry in config["lean_lib"]}
          if sources != targets:
              raise SystemExit(f"Lake targets mismatch: only in source={sources-targets}, "
                               f"only in lakefile={targets-sources}")
          for doc in ("README.md", "PROOF_ARCHITECTURE.md", "ASSUMPTION_AUDIT.md"):
              names = set(re.findall(r"\b([A-Za-z][A-Za-z0-9_]+)\.lean\b",
                                     Path(doc).read_text()))
              missing = names - sources
              if missing:
                  raise SystemExit(f"{doc} references missing Lean modules: {sorted(missing)}")
          print(f"OK: {len(sources)} existing Lean modules and both documents.")
          PY

      - name: Build all maintained proof certificates
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee lean-build.log
          status=${PIPESTATUS[0]}
          printf '\nBUILD_EXIT=%s\n' "$status" | tee -a lean-build.log
          exit "$status"

      - name: Reject unfinished proofs
        shell: bash
        run: |
          if grep -q 'sorryAx' lean-build.log; then
            echo 'The verification output contains sorryAx.' >&2
            exit 1
          fi

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-verification-log
          path: lean-build.log
          if-no-files-found: ignore
          retention-days: 14
