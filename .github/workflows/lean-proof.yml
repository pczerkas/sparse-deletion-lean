name: Lean proof verification

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Lean proof
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lean and Lake cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: true

      - name: Build verification targets
        shell: bash
        run: |
          set -o pipefail
          lake build VerifiedCompleteProof CompositeCorollary 2>&1 | tee lean-build.log
          status=${PIPESTATUS[0]}
          printf '\nBUILD_EXIT=%s\n' "$status" | tee -a lean-build.log
          exit "$status"

      - name: Reject unfinished proofs
        shell: bash
        run: |
          if grep -q 'sorryAx' lean-build.log; then
            echo 'The verification output contains sorryAx.' >&2
            exit 1
          fi

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-verification-log
          path: lean-build.log
          if-no-files-found: ignore
          retention-days: 14
