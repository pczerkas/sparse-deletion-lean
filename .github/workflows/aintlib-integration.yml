name: AINTLIB Hasse integration (isolated toolchain)

on:
  push:
    branches:
      - feature/aintlib-integration
    paths:
      - ".github/workflows/aintlib-integration.yml"
      - "integration/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aintlib-hasse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  downstream-hasse-smoke:
    name: Import AINTLIB Hasse in a downstream module
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      LEAN_NUM_THREADS: "2"

    steps:
      - name: Checkout sparse-deletion integration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout fixed, reviewed AINTLIB revision
        uses: actions/checkout@v4
        with:
          repository: CBirkbeck/AINTLIB
          ref: 8dafefa0f1f45af275e66007cfc6c28cbcd97089
          path: aintlib
          persist-credentials: false

      - name: Install elan and Lake (no local build)
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false

      - name: Check pinned upstream toolchain and mathlib
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat aintlib/lean-toolchain)" = "leanprover/lean4:v4.36.0-rc2"
          grep -F 'rev = "a2f96aabcf72be9e18bece4b5c7c54fcc0c029f4"' aintlib/lakefile.toml
          test "$(git -C aintlib rev-parse HEAD)" = "8dafefa0f1f45af275e66007cfc6c28cbcd97089"
          echo "External AINTLIB source and its separate Lean toolchain are pinned."

      - name: Restore Mathlib cache in GitHub runner
        shell: bash
        working-directory: aintlib
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Restore compiled AINTLIB Hasse cache
        id: aintlib-build-cache
        uses: actions/cache/restore@v4
        with:
          path: aintlib/.lake/build
          key: aintlib-hasse-8dafefa0-lean436rc2-v1

      - name: Build external AINTLIB Hasse capstone
        shell: bash
        working-directory: aintlib
        run: |
          set -euo pipefail
          lake build HasseWeil.HasseBound

      - name: Save compiled AINTLIB Hasse cache
        if: steps.aintlib-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: aintlib/.lake/build
          key: aintlib-hasse-8dafefa0-lean436rc2-v1

      - name: Verify our downstream bridge and exact axioms
        shell: bash
        working-directory: aintlib
        run: |
          set -euo pipefail
          lake env lean ../integration/AINTLIBSmoke.lean 2>&1 | tee ../aintlib-hasse-smoke.log
          if grep -Fq 'sorryAx' ../aintlib-hasse-smoke.log; then
            echo "Untrusted sorryAx appeared in the certificate output" >&2
            exit 1
          fi
          echo "AINTLIB Hasse and our downstream point-count bridge checked."

      - name: Verify cubic coordinate transformation
        shell: bash
        working-directory: aintlib
        run: |
          set -euo pipefail
          lake env lean ../integration/AINTLIBCubicModel.lean 2>&1 | tee ../aintlib-cubic-model.log
          if grep -Fq 'sorryAx' ../aintlib-cubic-model.log; then
            echo "Untrusted sorryAx in cubic-model certificate output" >&2
            exit 1
          fi

      - name: Verify exact count of elliptic points via the affine equation
        shell: bash
        working-directory: aintlib
        run: |
          set -euo pipefail
          lake env lean ../integration/AINTLIBPointCount.lean 2>&1 | tee ../aintlib-pointcount.log
          if grep -Fq 'sorryAx' ../aintlib-pointcount.log; then
            echo "Untrusted sorryAx in point-count certificate output" >&2
            exit 1
          fi

      - name: Verify quadratic character square-root fiber identity
        shell: bash
        working-directory: aintlib
        run: |
          set -euo pipefail
          lake env lean ../integration/AINTLIBCharacterFiber.lean 2>&1 | tee ../aintlib-fiber.log
          if grep -Fq 'sorryAx' ../aintlib-fiber.log; then
            echo "Untrusted sorryAx in character fiber certificate output" >&2
            exit 1
          fi

      - name: Verify finite Fubini count for affine solutions
        shell: bash
        working-directory: aintlib
        run: |
          set -euo pipefail
          lake env lean ../integration/AINTLIBFubini.lean 2>&1 | tee ../aintlib-fubini.log
          if grep -Fq 'sorryAx' ../aintlib-fubini.log; then
            echo "Untrusted sorryAx in Fubini certificate output" >&2
            exit 1
          fi

      - name: Install our point-count modules into isolated AINTLIB runner workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aintlib/projects/HasseWeil/HasseWeil/SparseDeletion
          cp integration/AINTLIBPointCount.lean aintlib/projects/HasseWeil/HasseWeil/SparseDeletion/PointCount.lean
          cp integration/AINTLIBFubini.lean aintlib/projects/HasseWeil/HasseWeil/SparseDeletion/Fubini.lean
          cp integration/AINTLIBCharacterFiber.lean aintlib/projects/HasseWeil/HasseWeil/SparseDeletion/CharacterFiber.lean
          cp integration/AINTLIBPointCharacterSum.lean aintlib/projects/HasseWeil/HasseWeil/SparseDeletion/PointCharacterSum.lean

      - name: Verify complete point-count character-sum identity
        shell: bash
        working-directory: aintlib
        run: |
          set -euo pipefail
          lake build HasseWeil.SparseDeletion.PointCharacterSum 2>&1 | tee ../aintlib-character-sum.log
          if grep -Fq 'sorryAx' ../aintlib-character-sum.log; then
            echo "Untrusted sorryAx in point character-sum certificate" >&2
            exit 1
          fi

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aintlib-hasse-smoke
          path: |
            aintlib-hasse-smoke.log
            aintlib-cubic-model.log
            aintlib-pointcount.log
            aintlib-fiber.log
            aintlib-fubini.log
            aintlib-character-sum.log
          if-no-files-found: ignore
          retention-days: 14
